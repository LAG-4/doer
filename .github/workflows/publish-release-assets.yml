name: Publish release assets

# Recovery path for when the automated `release` job cannot run (for
# example, `publish_cli` failed on missing npm credentials but the desktop
# artifacts built fine). Downloads the `desktop-*` artifacts of a completed
# Release run, merges the macOS updater manifests exactly like the release
# job does, and publishes the GitHub Release. Never builds anything.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Release workflow run id that holds the desktop-* artifacts"
        required: true
        type: string
      tag:
        description: "Release tag to publish (for example v0.0.41). Must already exist."
        required: true
        type: string
      make_latest:
        description: "Mark this release as latest (stable only)"
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  # Reading artifacts that belong to a different workflow run.
  actions: read

jobs:
  publish_assets:
    name: Publish release assets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...

      - name: Download all desktop artifacts
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ inputs.run_id }}
          pattern: desktop-*
          merge-multiple: true
          path: release-assets

      - name: Merge macOS updater manifests
        run: |
          shopt -s nullglob
          for x64_manifest in release-assets/*-mac-x64.yml; do
            arm64_manifest="${x64_manifest%-x64.yml}.yml"
            if [[ -f "$arm64_manifest" ]]; then
              node scripts/merge-update-manifests.ts --platform mac "$arm64_manifest" "$x64_manifest"
              rm -f "$x64_manifest"
            fi
          done

      - name: List release assets
        run: ls -la release-assets/

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          name: Doer ${{ inputs.tag }}
          generate_release_notes: true
          make_latest: ${{ inputs.make_latest == true }}
          files: |
            release-assets/*.dmg
            release-assets/*.zip
            release-assets/*.AppImage
            release-assets/*.exe
            release-assets/*.blockmap
            release-assets/*.yml
          fail_on_unmatched_files: true
          token: ${{ github.token }}
