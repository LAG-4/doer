# Store AppX (manual, no release)
#
# Builds the UNSIGNED Microsoft Store package for manual upload to Partner
# Center, where Microsoft signs it after certification. This workflow never
# publishes: no GitHub Release, no npm publish, no website assets, and the
# .appx never lands in the ligma download mirror (sync.sh only mirrors .exe).
#
# Version design: the APP version (default 0.0.56) flows end to end unchanged
# (package.json alignment, CLI archive, artifact names, in-app version). Only
# the packed manifest carries the mapped Store quad (app major+1: 0.0.56 ->
# manifest 1.0.56.0), rewritten by the staged appxManifestCreated hook,
# because electron-builder derives the manifest version from the app version
# verbatim. CI validates the unpacked manifest. Always a new version, never
# reuse a rejected one. Prereleases are rejected.
#
# Manual invocation (Actions -> Store AppX -> Run workflow):
#   version:                    App version (for example 0.0.56).
#   appx_identity_name:         Partner Center -> product -> Package identity
#                               -> Name (often numeric-prefixed, hyphens OK).
#   appx_publisher:             Package identity -> Publisher (CN=<guid>).
#   appx_publisher_display_name: Package identity -> Publisher display name.
#   appx_display_name:          Reserved packaged app display name. This may
#                               differ from the Win32 "Doer" name (which may be
#                               held) and from the exe product name
#                               ("Doer (Alpha)", left untouched).
#
# The four identity inputs are mapped to step-level env vars, which override
# any repo vars for these steps, and the build fails closed without all four.
# Preflight validates identity shape + version mapping BEFORE the expensive
# WSL/Windows jobs run. Post-build, the Windows job unpacks the .appx with the
# real makeappx binary (located from the builder cache / Windows SDK, never a
# guessed path) and validates the actual manifest (Identity.Name/Publisher /
# DisplayName/version/applicationId/protocol/runFullTrust + own brand assets);
# package existence alone is not acceptance. SHA256 + manifest are retained as
# evidence alongside the package.
#
# After the run: download the `doer-store-appx-<app-version>` artifact,
# upload the .appx to a NEW packaged submission in Partner Center (never
# delete the existing Win32 app name to reuse it), then sideload + run the
# Windows App Cert Kit locally before submitting. A green build is not a
# certification decision: WACK, manual policy review (runFullTrust
# justification, background/subprocess behavior), and Store policies still
# apply. Updating an already-certified packaged listing requires a mapped
# Store version strictly higher than the certified one.

name: Store AppX

on:
  workflow_dispatch:
    inputs:
      version:
        description: "App version (for example 0.0.56). Manifest carries major+1. Must be new; never reuse a rejected version."
        required: false
        type: string
        default: "0.0.56"
      appx_identity_name:
        description: "Partner Center package identity Name."
        required: true
        type: string
      appx_publisher:
        description: "Partner Center package identity Publisher (CN=...)."
        required: true
        type: string
      appx_publisher_display_name:
        description: "Partner Center package identity Publisher display name."
        required: true
        type: string
      appx_display_name:
        description: "Reserved packaged app display name (may differ from the Win32 name)."
        required: true
        type: string

concurrency:
  group: store-appx
  cancel-in-progress: false

permissions:
  contents: read
  id-token: none

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      app_version: ${{ steps.store_meta.outputs.app_version }}
      manifest_version: ${{ steps.store_meta.outputs.manifest_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - id: store_meta
        name: Validate identity and resolve Store version
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_IDENTITY_NAME: ${{ github.event.inputs.appx_identity_name }}
          INPUT_PUBLISHER: ${{ github.event.inputs.appx_publisher }}
          INPUT_PUBLISHER_DISPLAY_NAME: ${{ github.event.inputs.appx_publisher_display_name }}
          INPUT_DISPLAY_NAME: ${{ github.event.inputs.appx_display_name }}
        run: |
          set -euo pipefail
          raw="${INPUT_VERSION:-0.0.56}"
          app_version="${raw#v}"
          # Fail fast before the 45-minute WSL/Windows jobs: Store builds take
          # plain X.Y.Z app versions (no prerelease); the manifest mapping
          # (major+1, revision 0) needs components 0..65535, app major <= 65534.
          # Components are canonical (0|[1-9][0-9]*): leading zeros would make
          # bash arithmetic read them as octal, diverging from the shared JS
          # parser. Values are never echoed: inputs land in the public
          # manifest, but logs should not repeat them.
          if [[ ! "$app_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid Store app version (must be canonical X.Y.Z, no leading zeros, no prerelease)." >&2
            exit 1
          fi
          IFS=. read -r major minor patch <<< "$app_version"
          for part in "$major" "$minor" "$patch"; do
            if (( part > 65535 )); then
              echo "Invalid Store app version (component out of range 0..65535)." >&2
              exit 1
            fi
          done
          if (( major > 65534 )); then
            echo "Invalid Store app version (major+1 would exceed 65535)." >&2
            exit 1
          fi
          manifest_version="$((major + 1)).${minor}.${patch}.0"
          # Identity shape mirrors resolveStoreAppxIdentity (v26 AppxTarget.js:
          # Identity.Name /^[a-zA-Z0-9.-]+$/ 3..50; publisher CN=<guid>).
          if [[ ! "${INPUT_IDENTITY_NAME:-}" =~ ^[A-Za-z0-9.-]+$ ]] \
            || (( ${#INPUT_IDENTITY_NAME} < 3 || ${#INPUT_IDENTITY_NAME} > 50 )); then
            echo "Invalid appx_identity_name (must match /^[a-zA-Z0-9.-]+$/ 3..50 chars)." >&2
            exit 1
          fi
          if [[ "${INPUT_PUBLISHER:-}" != CN=* || ${#INPUT_PUBLISHER} -le 3 ]]; then
            echo "Invalid appx_publisher (must be CN=<guid>)." >&2
            exit 1
          fi
          for field in INPUT_PUBLISHER_DISPLAY_NAME INPUT_DISPLAY_NAME; do
            value="${!field:-}"
            if [[ -z "${value// }" || ${#value} -gt 256 ]]; then
              echo "Invalid display name input (must be 1..256 chars)." >&2
              exit 1
            fi
          done
          {
            echo "app_version=$app_version"
            echo "manifest_version=$manifest_version"
          } >> "$GITHUB_OUTPUT"
          echo "App $app_version -> manifest $manifest_version (app version kept end to end)."

  checks:
    name: Store readiness checks
    needs: [preflight]
    if: ${{ !failure() && !cancelled() && needs.preflight.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install desktop dependencies
        run: vp install --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - name: Typecheck scripts package
        run: vp run --filter @t3tools/scripts typecheck

      - name: Ensure Electron runtime for desktop typecheck
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Typecheck desktop package
        run: vp run --filter @t3tools/desktop typecheck

      - name: Lint changed TypeScript
        run: >-
          vp lint scripts/build-desktop-artifact.ts scripts/build-store-appx.test.ts
          scripts/validate-store-appx-manifest.ts
          scripts/lib/store-appx-version.ts scripts/lib/store-appx-assets.ts
          apps/desktop/src/updates/DesktopUpdates.ts
          apps/desktop/src/updates/DesktopStoreUpdates.test.ts
          apps/desktop/src/updates/updatesTestHarness.ts
          apps/desktop/src/main.ts apps/desktop/src/app/DesktopEnvironment.ts

      - name: Run Store packaging tests
        run: vp test run scripts/build-store-appx.test.ts scripts/build-desktop-artifact.test.ts

      - name: Run desktop update and environment tests
        run: >-
          vp test run apps/desktop/src/updates/DesktopStoreUpdates.test.ts
          apps/desktop/src/updates/DesktopUpdates.test.ts
          apps/desktop/src/updates/DesktopRemoteUpdates.test.ts
          apps/desktop/src/updates/updateChannels.test.ts
          apps/desktop/src/updates/updateMachine.test.ts
          apps/desktop/src/app/DesktopEnvironment.test.ts

  build_wsl_runtime:
    name: Build WSL runtime for Store package
    needs: [preflight, checks]
    if: ${{ !failure() && !cancelled() && needs.preflight.result == 'success' && needs.checks.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Align package versions to app version
        shell: bash
        env:
          APP_VERSION: ${{ needs.preflight.outputs.app_version }}
        run: node scripts/update-release-package-versions.ts "$APP_VERSION"

      - name: Build Linux resource monitor
        run: cargo build --locked --release --target x86_64-unknown-linux-gnu --manifest-path native/resource-monitor/Cargo.toml

      - name: Build Linux CLI archive for WSL
        shell: bash
        env:
          VP_NODE_VERSION: "26.8.2"
          APP_VERSION: ${{ needs.preflight.outputs.app_version }}
        run: |
          set -euo pipefail
          vp run --filter @t3tools/web build
          node apps/server/scripts/cli.ts build --verbose
          node apps/server/scripts/cli.ts build-exe --target linux-x64 --verbose
          monitor_dir="$RUNNER_TEMP/cli-resource-monitor"
          mkdir -p "$monitor_dir"
          cp "native/resource-monitor/target/x86_64-unknown-linux-gnu/release/t3-resource-monitor" "$monitor_dir/t3-resource-monitor"
          node scripts/build-cli-archive.ts \
            --platform linux \
            --arch x64 \
            --version "$APP_VERSION" \
            --resource-monitor-dir "$monitor_dir" \
            --output-dir release-cli

      - name: Smoke-test Linux CLI archive
        shell: bash
        env:
          APP_VERSION: ${{ needs.preflight.outputs.app_version }}
        run: node scripts/smoke-cli-archive.ts --archive release-cli/* --expect-version "$APP_VERSION"

      - name: Upload Linux CLI archive
        uses: actions/upload-artifact@v7
        with:
          name: cli-linux-x64
          path: release-cli/*
          if-no-files-found: error

  build_appx:
    name: Build Store AppX (Windows x64)
    needs: [preflight, checks, build_wsl_runtime]
    if: ${{ !failure() && !cancelled() && needs.preflight.result == 'success' && needs.checks.result == 'success' && needs.build_wsl_runtime.result == 'success' }}
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Resolve Windows package cache path
        id: package_cache_path
        shell: pwsh
        run: '"path=$(vp pm cache dir)" >> $env:GITHUB_OUTPUT'

      - name: Cache Windows packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.package_cache_path.outputs.path }}
          key: windows-store-appx-packages-v1-x64-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install desktop dependencies
        run: vp install --filter=@t3tools/desktop... --filter=@lag4/doer-cli... --filter=@t3tools/scripts...

      - name: Cache resource monitor
        id: resource_monitor_cache
        uses: actions/cache@v6
        with:
          path: native/resource-monitor/target/x86_64-pc-windows-msvc/release/t3-resource-monitor.exe
          key: resource-monitor-x86_64-pc-windows-msvc-${{ hashFiles('native/resource-monitor/Cargo.lock', 'native/resource-monitor/Cargo.toml', 'native/resource-monitor/src/**') }}

      - name: Setup Rust
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Align package versions to app version
        shell: bash
        env:
          APP_VERSION: ${{ needs.preflight.outputs.app_version }}
        run: node scripts/update-release-package-versions.ts "$APP_VERSION"

      - name: Download Linux CLI archive for WSL
        uses: actions/download-artifact@v7
        with:
          name: cli-linux-x64
          path: wsl-runtime

      - name: Install Spectre-mitigated MSVC libs
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -products * -latest -property installationPath
          $setupExe = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $proc = Start-Process -FilePath $setupExe `
            -ArgumentList "modify", "--installPath", "`"$installPath`"", "--add", `
            "Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre", "--quiet", "--norestart" `
            -Wait -PassThru -NoNewWindow
          if ($null -eq $proc -or $proc.ExitCode -ne 0) {
            $code = if ($null -ne $proc) { $proc.ExitCode } else { 1 }
            Write-Error "Visual Studio Installer failed with exit code $code"
            exit $code
          }

      - name: Build unsigned Store AppX
        shell: bash
        env:
          # Explicit workflow inputs override any repo vars for these steps.
          # Never fall back to repo vars: the build fails closed without all four.
          T3CODE_DESKTOP_APPX_IDENTITY_NAME: ${{ github.event.inputs.appx_identity_name }}
          T3CODE_DESKTOP_APPX_PUBLISHER: ${{ github.event.inputs.appx_publisher }}
          T3CODE_DESKTOP_APPX_PUBLISHER_DISPLAY_NAME: ${{ github.event.inputs.appx_publisher_display_name }}
          T3CODE_DESKTOP_APPX_DISPLAY_NAME: ${{ github.event.inputs.appx_display_name }}
          # Rust setup is skipped on cache hit, so reuse the cached binary.
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: ${{ steps.resource_monitor_cache.outputs.cache-hit == 'true' }}
          APP_VERSION: ${{ needs.preflight.outputs.app_version }}
        run: |
          set -euo pipefail
          vp run dist:desktop:artifact \
            --platform win \
            --target appx \
            --arch x64 \
            --build-version "$APP_VERSION" \
            --wsl-runtime "$GITHUB_WORKSPACE"/wsl-runtime/t3-*-linux-x64.tar.gz \
            --verbose

      - name: Unpack and validate Store package
        shell: pwsh
        env:
          EXPECTED_IDENTITY_NAME: ${{ github.event.inputs.appx_identity_name }}
          EXPECTED_PUBLISHER: ${{ github.event.inputs.appx_publisher }}
          EXPECTED_PUBLISHER_DISPLAY_NAME: ${{ github.event.inputs.appx_publisher_display_name }}
          EXPECTED_DISPLAY_NAME: ${{ github.event.inputs.appx_display_name }}
          APP_VERSION: ${{ needs.preflight.outputs.app_version }}
        run: |
          $ErrorActionPreference = "Stop"
          $appx = Get-ChildItem release/*.appx | Select-Object -First 1
          if ($null -eq $appx) { Write-Error "No .appx package was produced in release/."; exit 1 }
          # Locate the real makeappx binary with a recursive search bounded to
          # electron-builder's Windows codesign cache and the installed Windows
          # SDK bin roots (a single-level wildcard misses the nested
          # winCodeSign\windows-10\x64 and SDK \<version>\x64 layouts). Never a
          # guessed path. Prefer an x64 binary, accept any bounded hit.
          $searchRoots = @(
            (Join-Path $env:LOCALAPPDATA "electron-builder\Cache\winCodeSign"),
            "${env:ProgramFiles(x86)}\Windows Kits\10\bin",
            "$env:ProgramFiles\Windows Kits\10\bin"
          ) | Where-Object { Test-Path $_ }
          $makeappx = $searchRoots |
            ForEach-Object { Get-ChildItem -Path $_ -Filter "makeappx.exe" -Recurse -ErrorAction SilentlyContinue } |
            Where-Object { $_.FullName -match "\\x64\\" } |
            Select-Object -First 1
          if ($null -eq $makeappx) {
            $makeappx = $searchRoots |
              ForEach-Object { Get-ChildItem -Path $_ -Filter "makeappx.exe" -Recurse -ErrorAction SilentlyContinue } |
              Select-Object -First 1
          }
          if ($null -eq $makeappx) { Write-Error "makeappx.exe not found in builder cache or Windows SDK."; exit 1 }
          Write-Host "Using makeappx: $($makeappx.FullName)"
          New-Item -ItemType Directory -Force unpack | Out-Null
          # /o: the output dir is precreated above, so unpack must overwrite it
          # instead of prompting/failing.
          & $makeappx.FullName unpack /o /p "$($appx.FullName)" /d "$PWD/unpack" | Out-Host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $manifest = "$PWD/unpack/AppxManifest.xml"
          if (!(Test-Path $manifest)) { Write-Error "AppxManifest.xml missing after unpack."; exit 1 }
          $env:STORE_APPX_EXPECTED_IDENTITY_NAME = $env:EXPECTED_IDENTITY_NAME
          $env:STORE_APPX_EXPECTED_PUBLISHER = $env:EXPECTED_PUBLISHER
          $env:STORE_APPX_EXPECTED_PUBLISHER_DISPLAY_NAME = $env:EXPECTED_PUBLISHER_DISPLAY_NAME
          $env:STORE_APPX_EXPECTED_DISPLAY_NAME = $env:EXPECTED_DISPLAY_NAME
          $env:STORE_APPX_EXPECTED_APPLICATION_ID = "Doer"
          node scripts/validate-store-appx-manifest.ts "$manifest" --app-version "$env:APP_VERSION" --assets-dir "$PWD/unpack/assets"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Collect Store package and evidence
        shell: bash
        env:
          APP_VERSION: ${{ needs.preflight.outputs.app_version }}
        run: |
          set -euo pipefail
          mkdir -p store-publish
          shopt -s nullglob
          appx_files=(release/*.appx)
          if [[ ${#appx_files[@]} -eq 0 ]]; then
            echo "No .appx package was produced in release/." >&2
            ls -la release/ >&2 || true
            exit 1
          fi
          cp "${appx_files[@]}" store-publish/
          (cd store-publish && sha256sum ./*.appx > SHA256SUMS.txt)
          cp unpack/AppxManifest.xml "store-publish/AppxManifest-${APP_VERSION}.xml"
          ls -la store-publish/

      - name: Upload Store package
        uses: actions/upload-artifact@v7
        with:
          # Retained in CI for Partner Center upload; never attached to a
          # GitHub Release and never mirrored to the download site. Includes
          # the SHA256 digest and unpacked manifest as upload evidence.
          name: doer-store-appx-${{ needs.preflight.outputs.app_version }}
          path: store-publish/*
          if-no-files-found: error
